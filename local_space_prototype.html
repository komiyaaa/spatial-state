<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>空間IDベース永続状態モデル - プロトタイプ</title>
<style>
  :root {
    --bg: #fafaf9;
    --panel: #ffffff;
    --border: #e5e3de;
    --border-soft: #eeece7;
    --text: #2b2a27;
    --text-dim: #7a786f;
    --text-faint: #a7a59c;
    --accent: #0f9d8f;
    --accent-dark: #0c8377;
    --accent-soft: #e6f5f3;
    --danger: #d64545;
    --danger-soft: #fbeaea;
    --warn: #d98c2b;
    --neutral: #9a988e;
    --shadow-sm: 0 1px 2px rgba(30,29,26,0.05);
    --shadow-md: 0 4px 16px rgba(30,29,26,0.08);
    --radius: 8px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; flex-direction: column; height: 100vh; }
  .topbar {
    display: flex; align-items: center; gap: 12px;
    padding: 13px 20px; border-bottom: 1px solid var(--border);
    background: var(--panel); flex-shrink: 0; z-index: 5;
  }
  .topbar .brand {
    display: flex; align-items: center; gap: 8px; margin-right: 6px;
  }
  .topbar .brand-mark {
    width: 20px; height: 20px; border-radius: 5px; flex-shrink: 0;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
  }
  .topbar .brand-name { font-size: 12px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.02em; }
  .topbar h1 { font-size: 15px; font-weight: 600; margin: 0; color: var(--text); display: flex; align-items: center; gap: 8px; }
  .topbar .sub { font-size: 12px; color: var(--text-dim); }
  .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    border: 1px solid var(--border); background: var(--panel); color: var(--text);
    border-radius: 6px; padding: 5px 11px; font-size: 12.5px; cursor: pointer;
    transition: background 0.12s, border-color 0.12s;
  }
  .back-btn:hover { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-dark); }

  .fade-in { animation: fadeIn 0.18s ease-out; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(3px); } to { opacity: 1; transform: none; } }

  /* ---- 画面1: 建物一覧 + ローカル空間一覧 ---- */
  .screen-list { display: flex; flex: 1; min-height: 0; }
  .building-pane {
    width: 264px; flex-shrink: 0; border-right: 1px solid var(--border);
    background: var(--panel); display: flex; flex-direction: column;
  }
  .pane-header { padding: 14px 16px 8px; display: flex; align-items: center; justify-content: space-between; }
  .pane-header .label { font-size: 11.5px; font-weight: 700; color: var(--text-faint); letter-spacing: 0.06em; }
  .pane-header .total { font-size: 11px; color: var(--text-faint); }
  .search-box-wrap { position: relative; margin: 6px 14px 10px; }
  .search-box-wrap svg { position: absolute; left: 9px; top: 50%; transform: translateY(-50%); pointer-events: none; opacity: 0.45; }
  .search-box {
    width: 100%; padding: 7px 10px 7px 28px; border: 1px solid var(--border);
    border-radius: 6px; font-size: 13px; color: var(--text); background: var(--bg);
    transition: border-color 0.12s, box-shadow 0.12s; font-family: inherit;
  }
  .search-box:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); background: var(--panel); }
  .search-box::placeholder { color: var(--text-faint); }

  .building-list { overflow-y: auto; flex: 1; padding: 0 8px 8px; }
  .building-item {
    padding: 9px 10px; border-radius: 6px; font-size: 13px; cursor: pointer;
    color: var(--text); margin-bottom: 2px; transition: background 0.1s;
  }
  .building-item:hover { background: var(--accent-soft); }
  .building-item.active { background: var(--accent); color: white; }
  .building-item.active .re-num { opacity: 0.85; }
  .building-item .re-num {
    font-size: 10.5px; opacity: 0.55; display: block; margin-top: 1px;
    font-variant-numeric: tabular-nums;
  }
  .empty-state { padding: 28px 16px; text-align: center; color: var(--text-faint); font-size: 12.5px; line-height: 1.6; }

  .space-pane { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .space-pane-header {
    padding: 14px 20px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
  }
  .space-pane-header h2 { font-size: 14px; margin: 0; font-weight: 600; }
  .space-pane-header .count { font-size: 12px; color: var(--text-dim); background: var(--bg); padding: 3px 9px; border-radius: 20px; }
  .floor-groups { overflow-y: auto; flex: 1; padding: 16px 20px; }
  .floor-group { margin-bottom: 22px; }
  .floor-label {
    font-size: 11.5px; font-weight: 700; color: var(--text-faint); margin-bottom: 9px;
    letter-spacing: 0.04em; display: flex; align-items: center; gap: 8px;
  }
  .floor-label::after { content: ''; flex: 1; height: 1px; background: var(--border-soft); }
  .space-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(116px, 1fr)); gap: 10px; }
  .space-card {
    border: 1px solid var(--border); border-radius: var(--radius); padding: 13px 10px;
    background: var(--panel); cursor: pointer; text-align: center;
    transition: transform 0.12s, box-shadow 0.12s, border-color 0.12s;
  }
  .space-card:hover { border-color: var(--accent); background: var(--accent-soft); box-shadow: var(--shadow-sm); transform: translateY(-1px); }
  .space-card:active { transform: translateY(0); }
  .space-card .code { font-size: 14.5px; font-weight: 700; letter-spacing: 0.01em; }
  .space-card .zoom { font-size: 10.5px; color: var(--text-faint); margin-top: 4px; font-variant-numeric: tabular-nums; }
  .space-card .badge {
    display: inline-block; font-size: 9.5px; margin-top: 7px; padding: 2px 7px;
    border-radius: 3px; background: var(--accent-soft); color: var(--accent-dark); font-weight: 700;
    letter-spacing: 0.02em;
  }

  /* ---- 画面2: ローカル空間詳細 ---- */
  .screen-detail { display: none; flex: 1; min-height: 0; flex-direction: column; }
  .mode-tabs {
    display: flex; gap: 4px; padding: 10px 20px 0; border-bottom: 1px solid var(--border);
    background: var(--panel);
  }
  .mode-tab {
    padding: 9px 16px; font-size: 13px; cursor: pointer; color: var(--text-dim);
    border-bottom: 2px solid transparent; font-weight: 500; transition: color 0.12s;
  }
  .mode-tab:hover { color: var(--text); }
  .mode-tab.active { color: var(--accent-dark); border-bottom-color: var(--accent); font-weight: 600; }

  .viewer-wrap { flex: 1; display: flex; min-height: 0; position: relative; }
  #canvas-holder { flex: 1; position: relative; }
  #canvas-holder canvas { display: block; }

  .viewer-stats {
    position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.92);
    backdrop-filter: blur(6px); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 14px; font-size: 11.5px; color: var(--text-dim); box-shadow: var(--shadow-sm);
    display: flex; gap: 16px;
  }
  .viewer-stats .stat b { display: block; font-size: 16px; color: var(--text); font-weight: 700; line-height: 1.2; }
  .viewer-stats .stat span { font-size: 10.5px; color: var(--text-faint); }

  .viewer-fab {
    position: absolute; bottom: 16px; left: 14px; display: flex; gap: 8px;
  }
  .fab-btn {
    display: flex; align-items: center; gap: 6px; background: var(--panel); border: 1px solid var(--border);
    border-radius: 7px; padding: 7px 12px; font-size: 12px; cursor: pointer; box-shadow: var(--shadow-sm);
    color: var(--text); transition: background 0.12s, border-color 0.12s;
  }
  .fab-btn:hover { background: var(--accent-soft); border-color: var(--accent); }

  .viewer-side {
    width: 232px; flex-shrink: 0; border-left: 1px solid var(--border);
    background: var(--panel); padding: 16px; overflow-y: auto;
  }
  .side-label { font-size: 11.5px; font-weight: 700; color: var(--text-faint); margin: 0 0 8px; letter-spacing: 0.04em; }
  .color-mode-toggle { display: flex; border: 1px solid var(--border); border-radius: 6px; overflow: hidden; margin-bottom: 22px; }
  .color-mode-toggle button {
    flex: 1; border: none; background: var(--panel); padding: 7px 4px; font-size: 12px; cursor: pointer;
    color: var(--text); transition: background 0.12s, color 0.12s;
  }
  .color-mode-toggle button:not(.active):hover { background: var(--bg); }
  .color-mode-toggle button.active { background: var(--accent); color: white; font-weight: 600; }
  .legend-item {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 9px;
    justify-content: space-between;
  }
  .legend-item .lbl { display: flex; align-items: center; gap: 8px; }
  .legend-item .cnt { color: var(--text-faint); font-size: 11px; font-variant-numeric: tabular-nums; }
  .legend-swatch { width: 12px; height: 12px; border-radius: 3px; flex-shrink: 0; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08); }
  .legend-swatch.ghost {
    background: transparent !important; border: 1.5px dashed var(--danger); box-shadow: none;
  }
  .legend-note { font-size: 11px; color: var(--text-faint); margin-top: 16px; line-height: 1.6; padding-top: 14px; border-top: 1px solid var(--border-soft); }

  .space-info { margin-bottom: 20px; padding-bottom: 18px; border-bottom: 1px solid var(--border-soft); }
  .space-info .row { display: flex; justify-content: space-between; font-size: 12px; margin-bottom: 5px; }
  .space-info .row .k { color: var(--text-faint); }
  .space-info .row .v { color: var(--text); font-variant-numeric: tabular-nums; }

  .add-mode-wrap { flex: 1; display: flex; flex-direction: column; min-height: 0; min-width: 0; }

  #tooltip {
    position: absolute; pointer-events: none; background: rgba(30,29,26,0.94); color: white;
    font-size: 11.5px; padding: 7px 10px; border-radius: 7px; display: none; white-space: nowrap; line-height: 1.6;
    box-shadow: var(--shadow-md); z-index: 10;
  }
  #tooltip b { font-size: 11px; opacity: 0.75; font-weight: 500; }
</style>
</head>
<body>
<div class="app">

  <div class="topbar">
    <div class="brand">
      <div class="brand-mark"></div>
      <span class="brand-name">SPATIAL-STATE</span>
    </div>
    <h1 id="topbarTitle">建物一覧</h1>
    <span class="sub" id="topbarSub">— 整備済み建物からローカル空間を選択</span>
  </div>

  <!-- 画面1 -->
  <div class="screen-list" id="screenList">
    <div class="building-pane">
      <div class="pane-header">
        <span class="label">建物一覧</span>
        <span class="total" id="buildingTotal"></span>
      </div>
      <div class="search-box-wrap">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input class="search-box" id="buildingSearch" placeholder="不動産番号・建物名で検索">
      </div>
      <div class="building-list" id="buildingList"></div>
    </div>
    <div class="space-pane">
      <div class="space-pane-header">
        <h2 id="spacePaneTitle">整備中ローカル空間</h2>
        <span class="count" id="spacePaneCount"></span>
      </div>
      <div class="floor-groups" id="floorGroups"></div>
    </div>
  </div>

  <!-- 画面2 -->
  <div class="screen-detail" id="screenDetail">
    <div class="mode-tabs">
      <div class="mode-tab active" data-mode="viewer">ビューワモード</div>
      <div class="mode-tab" data-mode="add">追加モード(ラフレジストレーション)</div>
    </div>

    <div class="viewer-wrap" id="viewerModeWrap">
      <div id="canvas-holder">
        <div class="viewer-stats" id="viewerStats"></div>
        <div class="viewer-fab">
          <button class="fab-btn" id="btnResetCamera">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 12a9 9 0 1 1 3 6.7"/><path d="M3 16v-4h4"/></svg>
            視点をリセット
          </button>
        </div>
        <div id="tooltip"></div>
      </div>
      <div class="viewer-side">
        <div class="space-info" id="spaceInfo"></div>
        <div class="side-label">色分け</div>
        <div class="color-mode-toggle">
          <button id="btnColorState" class="active">状態</button>
          <button id="btnColorMobility">動的/静的</button>
        </div>
        <div class="side-label">凡例</div>
        <div id="legend"></div>
        <div class="legend-note">NEVER_OBSERVED / SCAN_COVERED のボクセルは、証拠がまだ無いため描画していません。</div>
      </div>
    </div>

    <div id="addModeWrap" class="add-mode-wrap" style="display:none;">
      <!-- registration-controller.js がこの中身を構築する -->
    </div>
  </div>

</div>

<script type="importmap">
{
  "imports": {
    "three": "https://esm.sh/three@0.160.0",
    "three/addons/": "https://esm.sh/three@0.160.0/examples/jsm/"
  }
}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { initRegistrationMode } from './registration/registration-controller.js';
import { postToServerHandler } from './registration/pointcloud-io.js';

/* ============================================================
   1. ダミーデータ(ERスキーマに沿った型)
   ============================================================ */

// BUILDING(実際のケースに合わせて、1件だけに絞る)
const buildings = [
  { building_id: "ichigaya_tamachi", real_estate_number: "未設定", name: "市ヶ谷田町校舎", address: "" },
];

// LOCAL_SPACE(tokutei_codeは "G" + 階 + 部屋番号、という独自解釈の一例)
function makeSpaces(buildingId, floors, roomsPerFloor) {
  const spaces = [];
  for (let f = 1; f <= floors; f++) {
    for (let r = 1; r <= roomsPerFloor; r++) {
      spaces.push({
        space_id: `${buildingId}-f${f}-r${r}`,
        building_id: buildingId,
        tokutei_code: `G${f}0${r}`,
        floor: f,
        zoom_level: 12,
        registered_at: "2026-07-20T09:00:00+09:00",
      });
    }
  }
  return spaces;
}
// 実際に持っているデータ(G002)だけを表示する。階は仮に1階としている
// (実際の階が分かれば tokutei_code/floor を書き換えてください)。
const localSpacesByBuilding = {
  ichigaya_tamachi: [
    {
      space_id: "ichigaya_tamachi-G002",
      building_id: "ichigaya_tamachi",
      tokutei_code: "G002",
      floor: 1,
      zoom_level: 12,
      registered_at: "2026-07-20T09:00:00+09:00",
    },
  ],
};

// SPATIAL_VOXEL + VOXEL_STATE + VOXEL_MOBILITY を、選択したローカル空間ごとに合成生成する
// (本来は空間IDごとの永続テーブルから取得する想定。ここではビューワが受け取るべき
//  データ形状を確定させるためのダミー生成。)
function generateVoxelsForSpace(spaceId) {
  const nx = 14, ny = 14, nz = 6;
  const voxels = [];
  let seed = 0;
  for (let i = 0; i < spaceId.length; i++) seed += spaceId.charCodeAt(i);
  function rand(x, y, z) {
    const v = Math.sin(seed + x * 12.9898 + y * 78.233 + z * 37.719) * 43758.5453;
    return v - Math.floor(v);
  }

  for (let x = 0; x < nx; x++) {
    for (let y = 0; y < ny; y++) {
      // 床(z=0): 全面OCCUPIED, 構造ラベルFLOOR, 静的
      voxels.push({ spatial_id: `${spaceId}/0/${x}/${y}`, x, y, z: 0,
        state: "OCCUPIED", mobility_flag: "STATIC", structural_label: "FLOOR" });

      // 壁(外周, z=1..4): OCCUPIED, 構造ラベルWALL, 静的
      const isWallXY = (x === 0 || x === nx - 1 || y === 0 || y === ny - 1);
      if (isWallXY) {
        for (let z = 1; z <= 4; z++) {
          voxels.push({ spatial_id: `${spaceId}/${z}/${x}/${y}`, x, y, z,
            state: "OCCUPIED", mobility_flag: "STATIC", structural_label: "WALL" });
        }
      }
    }
  }

  // 部屋の中央に「テーブル状の物体」を置く(ラベル無し、動的フラグ)
  const cx = Math.floor(nx / 2), cy = Math.floor(ny / 2);
  for (let dx = -2; dx <= 2; dx++) {
    for (let dy = -2; dy <= 2; dy++) {
      voxels.push({ spatial_id: `${spaceId}/1/${cx+dx}/${cy+dy}`, x: cx+dx, y: cy+dy, z: 1,
        state: "OCCUPIED", mobility_flag: "DYNAMIC", structural_label: null });
    }
  }

  // 隅の方に「消失した物体」(DECAYED)を置く(かつてOCCUPIEDだったが今は無い)
  for (let dx = 0; dx < 2; dx++) {
    for (let dy = 0; dy < 2; dy++) {
      voxels.push({ spatial_id: `${spaceId}/1/${2+dx}/${2+dy}`, x: 2+dx, y: 2+dy, z: 1,
        state: "DECAYED", mobility_flag: "DYNAMIC", structural_label: null });
    }
  }

  // 空間ごとに、ランダムにいくつか「静的だが宙に浮いた小物」を追加(棚の上の物、等の演出)
  for (let i = 0; i < 6; i++) {
    const rx = 3 + Math.floor(rand(i, 1, 0) * (nx - 6));
    const ry = 3 + Math.floor(rand(i, 2, 0) * (ny - 6));
    voxels.push({ spatial_id: `${spaceId}/2/${rx}/${ry}`, x: rx, y: ry, z: 2,
      state: "OCCUPIED", mobility_flag: rand(i, 3, 0) > 0.5 ? "STATIC" : "PENDING", structural_label: null });
  }

  return voxels;
}

/* ============================================================
   2. 画面1: 建物一覧 → ローカル空間一覧
   ============================================================ */

const buildingListEl = document.getElementById('buildingList');
const buildingTotalEl = document.getElementById('buildingTotal');
const buildingSearchEl = document.getElementById('buildingSearch');
const floorGroupsEl = document.getElementById('floorGroups');
const spacePaneTitle = document.getElementById('spacePaneTitle');
const spacePaneCount = document.getElementById('spacePaneCount');

let activeBuildingId = buildings[0].building_id;
let searchQuery = '';

function renderBuildingList() {
  buildingTotalEl.textContent = `${buildings.length}件`;
  const q = searchQuery.trim().toLowerCase();
  const filtered = q
    ? buildings.filter(b => b.name.toLowerCase().includes(q) || b.real_estate_number.includes(q))
    : buildings;

  buildingListEl.innerHTML = '';
  if (filtered.length === 0) {
    buildingListEl.innerHTML = `<div class="empty-state">「${escapeHtml(searchQuery)}」に一致する建物がありません</div>`;
    return;
  }
  filtered.forEach(b => {
    const el = document.createElement('div');
    el.className = 'building-item' + (b.building_id === activeBuildingId ? ' active' : '');
    el.innerHTML = `${b.name}<span class="re-num">${b.real_estate_number}</span>`;
    el.onclick = () => { activeBuildingId = b.building_id; renderBuildingList(); renderSpaceGrid(); };
    buildingListEl.appendChild(el);
  });
}

buildingSearchEl.addEventListener('input', (e) => {
  searchQuery = e.target.value;
  // 検索で現在選択中の建物が絞り込みから外れたら、先頭の一致建物に切り替える
  const q = searchQuery.trim().toLowerCase();
  if (q) {
    const filtered = buildings.filter(b => b.name.toLowerCase().includes(q) || b.real_estate_number.includes(q));
    if (filtered.length && !filtered.some(b => b.building_id === activeBuildingId)) {
      activeBuildingId = filtered[0].building_id;
      renderSpaceGrid();
    }
  }
  renderBuildingList();
});

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

function renderSpaceGrid() {
  const building = buildings.find(b => b.building_id === activeBuildingId);
  spacePaneTitle.textContent = `整備中ローカル空間 — ${building.name}`;
  const spaces = localSpacesByBuilding[activeBuildingId] || [];
  spacePaneCount.textContent = `${spaces.length}件`;

  const byFloor = {};
  spaces.forEach(s => { (byFloor[s.floor] ||= []).push(s); });

  floorGroupsEl.innerHTML = '';
  if (spaces.length === 0) {
    floorGroupsEl.innerHTML = `<div class="empty-state">この建物にはまだローカル空間が登録されていません</div>`;
    return;
  }
  Object.keys(byFloor).sort((a,b)=>a-b).forEach(floor => {
    const group = document.createElement('div');
    group.className = 'floor-group fade-in';
    group.innerHTML = `<div class="floor-label">${floor}階</div>`;
    const grid = document.createElement('div');
    grid.className = 'space-grid';
    byFloor[floor].forEach(s => {
      const card = document.createElement('div');
      card.className = 'space-card';
      card.innerHTML = `
        <div class="code">${s.tokutei_code}</div>
        <div class="zoom">zoom ${s.zoom_level}</div>
        <div class="badge">整備済み</div>
      `;
      card.onclick = () => openDetail(s);
      grid.appendChild(card);
    });
    group.appendChild(grid);
    floorGroupsEl.appendChild(group);
  });
}

/* ============================================================
   3. 画面2: ローカル空間詳細(ビューワ / 追加モード)
   ============================================================ */

const screenList = document.getElementById('screenList');
const screenDetail = document.getElementById('screenDetail');
const topbarTitle = document.getElementById('topbarTitle');
const topbarSub = document.getElementById('topbarSub');
let currentSpace = null;

function openDetail(space) {
  currentSpace = space;
  screenList.style.display = 'none';
  screenDetail.style.display = 'flex';
  topbarTitle.innerHTML = `<span class="back-btn" id="backBtn">← 一覧へ戻る</span> &nbsp; ${space.tokutei_code}`;
  topbarSub.textContent = `space_id: ${space.space_id}`;
  document.getElementById('backBtn').onclick = closeDetail;

  const building = buildings.find(b => b.building_id === space.building_id);
  document.getElementById('spaceInfo').innerHTML = `
    <div class="row"><span class="k">建物</span><span class="v">${building.name}</span></div>
    <div class="row"><span class="k">階</span><span class="v">${space.floor}階</span></div>
    <div class="row"><span class="k">特定コード</span><span class="v">${space.tokutei_code}</span></div>
    <div class="row"><span class="k">ズームレベル</span><span class="v">${space.zoom_level}</span></div>
  `;

  loadVoxels(space.space_id);

  // 【重要】この画面はさっきまでdisplay:noneで隠れていたため、Three.jsの
  // 初期化時点ではcanvasHolderの幅・高さが0で、既定の小さいサイズのまま
  // 固定されてしまっていた。表示し直した直後にレイアウトが確定してから、
  // 改めてリサイズ計算をやり直す。
  requestAnimationFrame(() => requestAnimationFrame(resizeRenderer));
}
function closeDetail() {
  screenDetail.style.display = 'none';
  screenList.style.display = 'flex';
  topbarTitle.textContent = '建物一覧';
  topbarSub.textContent = '— 整備済み建物からローカル空間を選択';
}

let registrationInitialized = false;
document.querySelectorAll('.mode-tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.mode-tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const isViewer = tab.dataset.mode === 'viewer';
    document.getElementById('viewerModeWrap').style.display = isViewer ? 'flex' : 'none';
    document.getElementById('addModeWrap').style.display = isViewer ? 'none' : 'flex';
    if (isViewer) requestAnimationFrame(() => requestAnimationFrame(resizeRenderer));

    // 追加モードは初回表示時にだけ構築する(Three.jsのビューワを毎回作り直さない)
    if (!isViewer && !registrationInitialized) {
      registrationInitialized = true;
      // サーバー(backend/server.py)へ送信する構成。ダウンロードに戻したい
      // 場合は outputHandler を downloadHandler に差し替えるだけでよい。
      initRegistrationMode(document.getElementById('addModeWrap'), {
        outputHandler: postToServerHandler,
        spaceId: currentSpace?.space_id ?? null,
      });
    }
  };
});

/* ============================================================
   4. 3Dビューワ(Three.js、InstancedMesh)
   ============================================================ */

const STATE_COLOR = {
  OCCUPIED: 0x4a7c74,
  DECAYED: 0xd64545,
  SCAN_COVERED: 0xcfcdc4,
  NEVER_OBSERVED: 0xffffff,
};
const MOBILITY_COLOR = {
  STATIC: 0x3a6ea5,
  DYNAMIC: 0xd98c2b,
  PENDING: 0x9a988e,
};

const LEGEND = {
  state: [
    ["占有(OCCUPIED)", STATE_COLOR.OCCUPIED, false],
    ["消失(DECAYED)", STATE_COLOR.DECAYED, true],
  ],
  mobility: [
    ["静的(STATIC)", MOBILITY_COLOR.STATIC, false],
    ["動的(DYNAMIC)", MOBILITY_COLOR.DYNAMIC, false],
    ["判断保留(PENDING)", MOBILITY_COLOR.PENDING, false],
  ],
};

let renderer, scene, camera, controls, solidMesh, ghostMesh, currentVoxels = [];
let colorMode = 'state';
const INITIAL_CAMERA_POS = [18, 16, 20];
const INITIAL_TARGET = [7, 2, 7];
const canvasHolder = document.getElementById('canvas-holder');
const tooltip = document.getElementById('tooltip');
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

function initThree() {
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0xf5f4f1);

  camera = new THREE.PerspectiveCamera(45, 1, 0.1, 1000);
  camera.position.set(...INITIAL_CAMERA_POS);

  renderer = new THREE.WebGLRenderer({ antialias: true });
  canvasHolder.appendChild(renderer.domElement);

  controls = new OrbitControls(camera, renderer.domElement);
  controls.target.set(...INITIAL_TARGET);
  controls.enableDamping = true;

  const hemi = new THREE.HemisphereLight(0xffffff, 0x555044, 1.1);
  scene.add(hemi);
  const dir = new THREE.DirectionalLight(0xffffff, 0.6);
  dir.position.set(10, 20, 10);
  scene.add(dir);

  // 床面の参照グリッド(空間の広がりを掴みやすくするための補助線)
  const grid = new THREE.GridHelper(20, 20, 0xd8d6cf, 0xeceae4);
  grid.position.y = -0.02;
  scene.add(grid);

  resizeRenderer();
  window.addEventListener('resize', resizeRenderer);
  renderer.domElement.addEventListener('mousemove', onHover);
  document.getElementById('btnResetCamera').onclick = () => {
    camera.position.set(...INITIAL_CAMERA_POS);
    controls.target.set(...INITIAL_TARGET);
    controls.update();
  };

  animate();
}
function resizeRenderer() {
  const w = canvasHolder.clientWidth, h = canvasHolder.clientHeight;
  if (!w || !h) return;
  renderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}

function loadVoxels(spaceId) {
  currentVoxels = generateVoxelsForSpace(spaceId).filter(
    v => v.state === 'OCCUPIED' || v.state === 'DECAYED'
  );
  buildMeshes();
  renderLegend();
  renderStats();
}

function renderStats() {
  const statsEl = document.getElementById('viewerStats');
  const occCount = currentVoxels.filter(v => v.state === 'OCCUPIED').length;
  const decCount = currentVoxels.filter(v => v.state === 'DECAYED').length;
  statsEl.innerHTML = `
    <div class="stat"><b>${occCount.toLocaleString()}</b><span>占有ボクセル</span></div>
    <div class="stat"><b>${decCount.toLocaleString()}</b><span>消失ボクセル</span></div>
  `;
}

/**
 * OCCUPIED(通常の実体ボックス)とDECAYED(ワイヤーフレームの"ゴースト"表示、
 * 「かつてここにあった」ことを視覚的に区別するため)を、別々のInstancedMeshで描く。
 */
function buildMeshes() {
  [solidMesh, ghostMesh].forEach(mesh => {
    if (mesh) { scene.remove(mesh); mesh.geometry.dispose(); mesh.material.dispose(); }
  });

  const solidVoxels = currentVoxels.filter(v => v.state === 'OCCUPIED');
  const ghostVoxels = currentVoxels.filter(v => v.state === 'DECAYED');

  const geo = new THREE.BoxGeometry(0.92, 0.92, 0.92);

  const solidMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.85, metalness: 0.0 });
  solidMesh = buildInstancedFromVoxels(solidVoxels, geo, solidMat);
  scene.add(solidMesh);

  const ghostMat = new THREE.MeshBasicMaterial({
    vertexColors: true, wireframe: true, transparent: true, opacity: 0.85,
  });
  ghostMesh = buildInstancedFromVoxels(ghostVoxels, geo, ghostMat);
  scene.add(ghostMesh);

  // 参照用に、どのインデックスがどのボクセルかを引けるようにしておく(ホバー判定用)
  solidMesh.userData.voxels = solidVoxels;
  ghostMesh.userData.voxels = ghostVoxels;
}

function buildInstancedFromVoxels(voxels, geo, mat) {
  const mesh = new THREE.InstancedMesh(geo, mat, Math.max(voxels.length, 1));
  mesh.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(Math.max(voxels.length, 1) * 3), 3);
  const m = new THREE.Matrix4();
  const color = new THREE.Color();
  voxels.forEach((v, i) => {
    m.makeTranslation(v.x, v.z, v.y); // three.jsのYを上向きにするため、モデルのzを上に割り当てる
    mesh.setMatrixAt(i, m);
    const hex = colorMode === 'state' ? STATE_COLOR[v.state] : MOBILITY_COLOR[v.mobility_flag];
    color.setHex(hex ?? 0xcccccc);
    mesh.setColorAt(i, color);
  });
  mesh.count = voxels.length; // 実データ数だけ描画する(ダミー確保分を除外)
  mesh.instanceMatrix.needsUpdate = true;
  if (mesh.instanceColor) mesh.instanceColor.needsUpdate = true;
  return mesh;
}

function onHover(ev) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((ev.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((ev.clientY - rect.top) / rect.height) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const hits = raycaster.intersectObjects([solidMesh, ghostMesh].filter(Boolean));
  if (hits.length > 0) {
    const hit = hits[0];
    const v = hit.object.userData.voxels[hit.instanceId];
    tooltip.style.display = 'block';

    // ツールチップが右端・下端で画面からはみ出さないようクランプする
    const tw = 200, th = 90; // おおよその想定サイズ
    let left = ev.clientX - rect.left + 14;
    let top = ev.clientY - rect.top + 10;
    if (left + tw > rect.width) left = ev.clientX - rect.left - tw - 8;
    if (top + th > rect.height) top = ev.clientY - rect.top - th - 8;
    tooltip.style.left = left + 'px';
    tooltip.style.top = top + 'px';

    tooltip.innerHTML = `<b>${v.spatial_id}</b><br>state: ${v.state}<br>mobility: ${v.mobility_flag}` +
      (v.structural_label ? `<br>label: ${v.structural_label}` : '');
  } else {
    tooltip.style.display = 'none';
  }
}

function renderLegend() {
  const legendEl = document.getElementById('legend');
  legendEl.innerHTML = '';
  const counts = {};
  currentVoxels.forEach(v => {
    const key = colorMode === 'state' ? v.state : v.mobility_flag;
    counts[key] = (counts[key] || 0) + 1;
  });

  LEGEND[colorMode].forEach(([label, hex, isGhost]) => {
    const row = document.createElement('div');
    row.className = 'legend-item';
    const colorTable = colorMode === 'state' ? STATE_COLOR : MOBILITY_COLOR;
    const key = Object.keys(colorTable).find(k => colorTable[k] === hex);
    const cnt = counts[key] || 0;
    const swatchClass = isGhost ? 'legend-swatch ghost' : 'legend-swatch';
    const swatchStyle = isGhost ? '' : `style="background:#${hex.toString(16).padStart(6,'0')}"`;
    row.innerHTML = `<span class="lbl"><span class="${swatchClass}" ${swatchStyle}></span>${label}</span><span class="cnt">${cnt.toLocaleString()}</span>`;
    legendEl.appendChild(row);
  });
}

document.getElementById('btnColorState').onclick = (e) => {
  colorMode = 'state';
  document.getElementById('btnColorState').classList.add('active');
  document.getElementById('btnColorMobility').classList.remove('active');
  buildMeshes(); renderLegend();
};
document.getElementById('btnColorMobility').onclick = (e) => {
  colorMode = 'mobility';
  document.getElementById('btnColorMobility').classList.add('active');
  document.getElementById('btnColorState').classList.remove('active');
  buildMeshes(); renderLegend();
};

/* ============================================================
   init
   ============================================================ */
renderBuildingList();
renderSpaceGrid();
initThree();
</script>
</body>
